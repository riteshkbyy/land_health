<!DOCTYPE html>
<html>
<head>
    <title>Main List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Main Records</h2>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Farmer Name</th>
                <th>pH</th>
                <th>EC</th>
                <th>N</th>
                <th>P</th>
                <th>K</th>
                <th>Author</th>
                <th>Published</th>
                <th>Created At</th>
            </tr>
        </thead>
        <tbody>
            {% for item in items %}
            <tr>
                <td>{{ item.farmer_name }}</td>
                <td>{{ item.ph }}</td>
                <td>{{ item.ec }}</td>
                <td>{{ item.n }}</td>
                <td>{{ item.p }}</td>
                <td>{{ item.k }}</td>
                <td>{{ item.author }}</td>
                <td>{{ item.is_published }}</td>
                <td>{{ item.created_at }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
